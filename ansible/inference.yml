---
# Configure the inference nodes, one play per vendor group. Run from inside
# CT 100 after a node has been registered with node-config:
#
#   ansible-playbook inference.yml --limit q02b   # NVIDIA: driver + CUDA, llama.cpp
#   ansible-playbook inference.yml --limit q02a   # Intel Max: pinned kernel, LTS 2523
#
# NVIDIA nodes get the NVIDIA driver + CUDA, then llama.cpp built and the
# llama-server unit installed. Intel Max nodes get the intel_xpu role, which
# reboots the node up to twice (into the pinned kernel, then to load the driver
# through scn-pvc-init); nothing serves on them yet.
#
# The hosts come from the git-ignored runtime inventory (inventory/local.yml);
# the committed inventory only declares empty groups, so a no-`--limit` run is
# safe on a fresh checkout (it simply matches nothing). Each play targets its
# vendor group, never all of inference_nodes, so a node never gets another
# vendor's stack.
#
# Reached over SSH as the `ansible` user using CT 100's root ed25519 key (the
# same key generated by the control_node role). The ansible user, its sudo and
# the key come from node-config's Prepare a node; Secure Boot disabled is still
# a firmware step. See docs/roles/nvidia_cuda.md.

- name: Configure NVIDIA inference nodes
  hosts: nvidia_nodes
  remote_user: ansible
  become: true
  pre_tasks:
    - name: Turn off password SSH logins
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/sshd_keys_only.yml"
  roles:
    - nvidia_cuda
    - llama_server

- name: Configure Intel Max inference nodes
  hosts: intel_xpu_nodes
  remote_user: ansible
  become: true
  pre_tasks:
    - name: Turn off password SSH logins
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/sshd_keys_only.yml"
  roles:
    - intel_xpu
