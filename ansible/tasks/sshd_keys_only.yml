---
# Turn off password SSH logins (#56). Root and the `ansible` user were already
# key-only; the accounts this closes are the human sudo accounts github_user
# creates, whose temp password stays because PAM needs it for the forced change
# on first login and sudo asks for it after. It only stops opening SSH.
#
#   - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/sshd_keys_only.yml"
#
# Included by the control_node role (CT 100), add-github-user.yml (wherever a
# password account is made) and the inference node plays. The Proxmox hosts
# stay outside Ansible (ADR-0008) and are already key-only for root.
#
# Named 00- on purpose: sshd keeps the first value it reads for a keyword, and
# reads sshd_config.d/*.conf in name order from the Include at the top of
# sshd_config. Cloud and Ubuntu images ship 50-cloud-init.conf with
# PasswordAuthentication yes, which a later-sorting name would lose to.

- name: SSH | Check for an SSH server
  ansible.builtin.stat:
    path: /usr/sbin/sshd
  register: sshd_binary

- name: SSH | Allow key logins only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-corliss-ops.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by corliss-ops (tasks/sshd_keys_only.yml). Keys only (#56).
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  register: sshd_dropin
  when: sshd_binary.stat.exists

# The whole config, drop-in included, must still parse before sshd reloads.
- name: SSH | Check the full server config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  when: sshd_binary.stat.exists

# Ubuntu 24.04 starts ssh.service from ssh.socket on the first connection, so
# the service can be inactive; it reads the new config whenever it next starts.
# Reload, never restart: open sessions (this one included) stay up.
- name: SSH | Reload the server to apply it
  ansible.builtin.shell: |
    if systemctl is-active -q ssh.service; then systemctl reload ssh.service; fi
  when: sshd_dropin is changed
